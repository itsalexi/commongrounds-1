{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2>Project Detail</h2>
<a href="{% url 'diyprojects:project_list' %}">Back to List</a>

<h3>{{ project.title }}</h3> 
  <h4> Category: {{ project.category.name }}</h4>
  <p>{{ project.description }}</p>
  <h3>Materials</h3>
  <p>{{ project.materials }}</p>
  <h3>Steps</h3>
  <p>{{ project.steps }}</p>
  <p>Created on: {{ project.created_on }}</p>

{% endblock %}
