{% extends 'base.html' %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<main class="min-h-screen bg-surface px-6 py-12">
  <section class="max-w-sm mx-auto rounded-lg border border-border bg-white p-6">
    <p class="text-xs font-semibold uppercase tracking-widest text-text-subtle">Account</p>
    <h1 class="mt-2 font-display text-3xl font-bold text-text">Check your email</h1>
    <p class="mt-3 text-sm leading-6 text-text-subtle">If an account exists for that address, a password reset link is on its way.</p>
    <a href="{% url 'login' %}" class="mt-6 inline-flex rounded bg-primary px-5 py-2.5 text-sm font-medium text-on-primary hover:bg-primary-hover">Back to login</a>
  </section>
</main>
{% endblock %}
