{% extends 'base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
{% if validlink %}
<h1>Set New Password</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Change password</button>
</form>
{% else %}
<p>Invalid password reset link.</p>
<p><a href="{% url 'password_reset' %}">Request a new one</a></p>
{% endif %}
{% endblock %}
