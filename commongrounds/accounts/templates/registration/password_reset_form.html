{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<main class="min-h-screen bg-surface px-6 py-12">
  <section class="max-w-sm mx-auto rounded-lg border border-border bg-white p-6">
    <p class="text-xs font-semibold uppercase tracking-widest text-text-subtle">Account</p>
    <h1 class="mt-2 font-display text-3xl font-bold text-text">Reset Password</h1>
    <p class="mt-3 text-sm leading-6 text-text-subtle">Enter your email and we'll send a reset link.</p>

    <form method="post" class="auth-form mt-6">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full rounded bg-primary px-5 py-2.5 text-sm font-medium text-on-primary hover:bg-primary-hover">Send reset link</button>
    </form>

    <p class="mt-5 text-sm text-text-subtle">
      <a href="{% url 'login' %}" class="font-medium text-primary hover:text-primary-hover">Back to login</a>
    </p>
  </section>
</main>
{% endblock %}
