{% extends "base.html" %}
{% load static %}

{% block title %}Common Grounds{% endblock %}

{% block content %}
<section class="relative flex items-center justify-center min-h-[92vh] overflow-hidden">

  <img src="{% static 'img/hero.webp' %}" class="absolute inset-0 w-full h-full object-cover scale-105"
    style="filter: blur(3px);">
  <div class="absolute inset-0 bg-surface/60"></div>
  <div class="absolute inset-x-0 bottom-0 h-3/5 bg-gradient-to-t from-surface to-transparent"></div>

  <div class="relative z-10 text-center max-w-xl mx-auto px-6">
    <h1 class="font-display text-4xl md:text-5xl font-bold text-text tracking-tight mb-5 leading-snug">
      Find your people.
    </h1>
    <p class="text-text-subtle text-base leading-relaxed mb-10 max-w-sm mx-auto">
      Events, book clubs, local makers, and more. Common Grounds is where your community actually gathers.
    </p>
    <div class="flex items-center justify-center gap-3">
      <a href="{% url 'merchstore:product_list' %}"
        class="bg-primary hover:bg-primary-hover text-on-primary text-sm font-medium px-6 py-2.5 rounded transition-colors">
        Explore the Space
      </a>
      <a href="{% url 'localevents:event_list' %}"
        class="border border-text/60 text-text text-sm font-medium px-6 py-2.5 rounded hover:border-text transition-colors">
        View Upcoming Events
      </a>
    </div>
  </div>

</section>
{% endblock %}
